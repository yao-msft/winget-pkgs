name: Manifest Metadata Elevation Reminder

on:
  pull_request_target:
    branches: [master]
    types: [labeled]

# Fork pull requests are safe here because no pull request content is checked out
# or executed. The workflow only reads trusted GitHub API state and may comment.
permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: manifest-metadata-elevation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remind:
    if: >-
      github.repository == 'microsoft/winget-pkgs' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'Validation-Completed' &&
      (
        (
          github.event.sender.login == 'wingetvalidator-prod[bot]' &&
          github.event.sender.type == 'Bot'
        ) ||
        (
          github.event.sender.login == 'wingetbot' &&
          github.event.sender.type == 'User'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post elevation requirement reminder
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_PULL_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'microsoft';
            const repo = 'winget-pkgs';
            const pullNumberText = process.env.EVENT_PULL_NUMBER || '';
            const eventPullNumber = Number(pullNumberText);
            const eventHead = process.env.EVENT_HEAD_SHA || '';
            const eventBase = process.env.EVENT_BASE_SHA || '';
            const hardAbortLabels = new Set([
              'Binary-Validation-Error',
              'Package-Flagged',
              'Error-Hash-Mismatch',
              'Needs-SmartScreen-Investigation',
              'PUA-Detection',
              'URL-Validation-Error',
              'Validation-Defender-Error',
              'Validation-Domain',
              'Validation-Executable-Error',
              'Validation-Hash-Flagged',
              'Validation-Hash-Verification-Failed',
              'Validation-Indirect-URL',
              'Validation-SmartScreen',
              'Validation-SmartScreen-Error',
              'Validation-Unapproved-URL',
              'Validation-Virus-Scan-Error',
              'Waived-Validation-Defender-Error'
            ]);
            const elevationMarker =
              'Template: msftbot/authorAssist/elevationRequirement';
            const sectionMarker = '**Elevation requirement:**';
            const duplicateMarker =
              `<!-- elevation-requirement-reminder:${eventHead} -->`;
            const trustedCommenters = new Set([
              'github-actions[bot]',
              'msftbot[bot]',
              'wingetbot'
            ]);
            const supportedValues = new Set([
              'elevatesSelf',
              'elevationRequired',
              'elevationProhibited'
            ]);
            const parseTrustedCompletion = (
              check,
              headSha,
              expectedPullNumber = null
            ) => {
              if (
                !check ||
                !Number.isSafeInteger(check.id) ||
                check.id < 1 ||
                check?.app?.id !== 1451866 ||
                check.app.slug !== 'wingetvalidator-prod' ||
                check.head_sha !== headSha ||
                check.name !== '10. Validation Completed' ||
                check.status !== 'completed' ||
                check.conclusion !== 'success' ||
                typeof check.external_id !== 'string' ||
                !check.external_id
              ) {
                return null;
              }
              const text = check.output?.text;
              if (typeof text !== 'string' || text.length > 12000) {
                return null;
              }
              const blocks = [
                ...text.matchAll(/```json\s*([\s\S]*?)```/gi)
              ];
              if (blocks.length !== 1) {
                return null;
              }
              let payload;
              try {
                payload = JSON.parse(blocks[0][1]);
              } catch {
                return null;
              }
              if (
                !payload ||
                typeof payload !== 'object' ||
                Array.isArray(payload) ||
                !Number.isSafeInteger(payload.PullRequestNumber) ||
                payload.PullRequestNumber < 1 ||
                (
                  expectedPullNumber !== null &&
                  payload.PullRequestNumber !== expectedPullNumber
                ) ||
                payload.OperationId !== check.external_id ||
                !Array.isArray(payload.Labels)
              ) {
                return null;
              }
              const successLabels = payload.Labels.filter((label) =>
                label &&
                typeof label === 'object' &&
                !Array.isArray(label) &&
                label.Name === 'Validation-Completed' &&
                label.Result === 'Success'
              );
              return successLabels.length === 1 ? payload : null;
            };
            const validationBackoffMs = [0, 2000, 4000, 8000, 16000, 30000];
            const wait = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));
            const findTrustedCompletedValidation = async (
              headSha,
              pullNumber,
              expected = null
            ) => {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                app_id: 1451866,
                filter: 'latest',
                per_page: 100
              });
              const total = response.data?.total_count;
              const checks = response.data?.check_runs;
              if (
                !Number.isSafeInteger(total) ||
                total < 0 ||
                total > 100 ||
                !Array.isArray(checks) ||
                checks.length !== total
              ) {
                throw new Error('Validator Check set response was incomplete.');
              }
              const completions = checks.filter((check) =>
                check?.app?.id === 1451866 &&
                check?.app?.slug === 'wingetvalidator-prod' &&
                check.head_sha === headSha &&
                check.name === '10. Validation Completed' &&
                check.status === 'completed'
              );
              if (completions.length !== 1) {
                return null;
              }
              const check = completions[0];
              const payload = parseTrustedCompletion(
                check,
                headSha,
                pullNumber
              );
              if (
                payload === null ||
                (
                  expected !== null &&
                  (
                    check.id !== expected.checkId ||
                    payload.OperationId !== expected.operationId
                  )
                )
              ) {
                return null;
              }
              return Object.freeze({
                checkId: check.id,
                operationId: payload.OperationId
              });
            };
            const pollTrustedCompletedValidation = async (
              headSha,
              pullNumber
            ) => {
              for (
                let attempt = 0;
                attempt < validationBackoffMs.length;
                attempt += 1
              ) {
                if (validationBackoffMs[attempt] > 0) {
                  await wait(validationBackoffMs[attempt]);
                }
                const completion = await findTrustedCompletedValidation(
                  headSha,
                  pullNumber
                );
                if (completion !== null) {
                  return completion;
                }
              }
              return null;
            };
            const installerPath =
              /^manifests\/.+\.installer\.ya?ml$/i;
            const maxManifestBytes = 1024 * 1024;
            const maxContentResponseBytes = 2 * 1024 * 1024;
            const recordValue = (map, value) =>
              map.set(value, (map.get(value) || 0) + 1);

            function elevationValues(content) {
              const values = [];
              let inInstallers = false;
              let sequenceIndent = null;
              let hasInstaller = false;
              const valuePattern =
                /^ElevationRequirement:\s*([A-Za-z]+)\s*(?:#.*)?$/;
              const record = (text) => {
                const match = text.match(valuePattern);
                if (match && supportedValues.has(match[1])) {
                  values.push(match[1]);
                }
              };

              for (const line of content.replace(/\r\n/g, '\n').split('\n')) {
                if (!line.trim() || /^\s*#/.test(line)) {
                  continue;
                }
                if (/^ *\t/.test(line)) {
                  throw new Error('Manifest YAML contains tab indentation.');
                }
                const indent = line.match(/^ */)[0].length;
                const text = line.slice(indent);
                const item = text.match(/^-\s+(.+)$/);

                if (
                  inInstallers &&
                  item &&
                  (sequenceIndent === null || indent === sequenceIndent)
                ) {
                  if (indent !== 0 && indent !== 2) {
                    throw new Error('Installers sequence indentation is unsupported.');
                  }
                  sequenceIndent = indent;
                  hasInstaller = true;
                  record(item[1]);
                  continue;
                }

                if (indent === 0) {
                  record(text);
                  inInstallers = /^Installers:\s*(?:#.*)?$/.test(text);
                  sequenceIndent = null;
                  hasInstaller = false;
                  continue;
                }

                if (
                  inInstallers &&
                  hasInstaller &&
                  sequenceIndent !== null &&
                  indent === sequenceIndent + 2
                ) {
                  record(text);
                }
              }
              return values;
            }

            function decodeContent(file, path) {
              if (
                !file ||
                typeof file !== 'object' ||
                Array.isArray(file) ||
                file.type !== 'file' ||
                file.path !== path ||
                file.encoding !== 'base64' ||
                !Number.isSafeInteger(file.size) ||
                file.size < 0 ||
                file.size > maxManifestBytes ||
                typeof file.content !== 'string'
              ) {
                throw new Error('Manifest content response was incomplete.');
              }
              const encoded = file.content.replace(/[\r\n]/g, '');
              if (
                encoded.length % 4 !== 0 ||
                !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)
              ) {
                throw new Error('Manifest content was not valid base64.');
              }
              const bytes = Buffer.from(encoded, 'base64');
              if (bytes.length !== file.size) {
                throw new Error('Manifest content size did not match its metadata.');
              }
              const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
              if (text.includes('\0')) {
                throw new Error('Manifest content contained a null byte.');
              }
              return text;
            }

            async function readManifest(repositoryOwner, repositoryName, path, ref) {
              if (
                repositoryOwner.toLowerCase() === owner &&
                repositoryName.toLowerCase() === repo
              ) {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref
                });
                return decodeContent(response.data, path);
              }
              if (
                !/^(?!.*--)[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(repositoryOwner) ||
                !/^[A-Za-z0-9._-]{1,100}$/.test(repositoryName) ||
                repositoryName === '.' ||
                repositoryName === '..'
              ) {
                throw new Error('Fork repository identity was invalid.');
              }
              const encodedPath = path
                .split('/')
                .map((part) => encodeURIComponent(part))
                .join('/');
              const url =
                `https://api.github.com/repos/${encodeURIComponent(repositoryOwner)}/` +
                `${encodeURIComponent(repositoryName)}/contents/${encodedPath}` +
                `?ref=${encodeURIComponent(ref)}`;
              const response = await fetch(url, {
                method: 'GET',
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
                headers: {
                  Accept: 'application/vnd.github+json',
                  'Accept-Encoding': 'identity',
                  'User-Agent': 'manifest-metadata-review'
                }
              });
              if (response.redirected) {
                throw new Error('Fork content API redirected unexpectedly.');
              }
              const contentLengthText = response.headers.get('content-length');
              let contentLength = null;
              if (contentLengthText !== null) {
                if (!/^[1-9][0-9]*$/.test(contentLengthText)) {
                  throw new Error('Fork content API Content-Length was invalid.');
                }
                contentLength = Number(contentLengthText);
                if (
                  !Number.isSafeInteger(contentLength) ||
                  contentLength > maxContentResponseBytes
                ) {
                  throw new Error(
                    'Fork content API response exceeded its byte limit.'
                  );
                }
              }
              if (!response.body || typeof response.body.getReader !== 'function') {
                throw new Error('Fork content API response body was unavailable.');
              }
              const chunks = [];
              let actualLength = 0;
              const reader = response.body.getReader();
              while (true) {
                const { done, value } = await reader.read();
                if (done) {
                  break;
                }
                if (!(value instanceof Uint8Array)) {
                  throw new Error('Fork content API response body was invalid.');
                }
                actualLength += value.byteLength;
                if (actualLength > maxContentResponseBytes) {
                  throw new Error('Fork content API response exceeded its byte limit.');
                }
                chunks.push(value);
              }
              if (
                contentLength !== null &&
                actualLength !== contentLength
              ) {
                throw new Error('Fork content API response size was invalid.');
              }
              const bytes = new Uint8Array(actualLength);
              let offset = 0;
              for (const chunk of chunks) {
                bytes.set(chunk, offset);
                offset += chunk.byteLength;
              }
              const responseText =
                new TextDecoder('utf-8', { fatal: true }).decode(bytes);
              if (!response.ok) {
                throw new Error(
                  `Fork content API request failed with status ${response.status}.`
                );
              }
              let file;
              try {
                file = JSON.parse(responseText);
              } catch {
                throw new Error('Fork content API response was not valid JSON.');
              }
              return decodeContent(file, path);
            }

            if (
              !/^[1-9][0-9]*$/.test(pullNumberText) ||
              !Number.isSafeInteger(eventPullNumber) ||
              !/^[0-9a-f]{40}$/.test(eventHead) ||
              !/^[0-9a-f]{40}$/.test(eventBase)
            ) {
              core.info('Skipped: invalid trusted event identity.');
              return;
            }

            const pullNumber = eventPullNumber;
            const { data: initialPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });
            const headRepository = String(
              initialPull.head?.repo?.full_name || ''
            );
            const headRepositoryParts = headRepository.split('/');
            const initialLabels = (initialPull.labels || []).map((label) =>
              String(label.name || '')
            );
            if (
              initialPull.state !== 'open' ||
              initialPull.head.sha !== eventHead ||
              initialPull.base.sha !== eventBase ||
              initialPull.base.ref !== 'master' ||
              initialPull.base.repo?.full_name?.toLowerCase() !== `${owner}/${repo}` ||
              headRepositoryParts.length !== 2 ||
              headRepositoryParts.some((part) => !part) ||
              initialPull.user?.login === 'wingetbot' ||
              !Array.isArray(initialPull.labels) ||
              !initialLabels.includes('Validation-Completed') ||
              !Number.isSafeInteger(initialPull.changed_files) ||
              initialPull.changed_files < 1 ||
              initialPull.changed_files > 100 ||
              initialLabels.some((label) => hardAbortLabels.has(label))
            ) {
              core.info('Skipped: pull request state is unsupported or unsafe.');
              return;
            }
            const validationCompletion =
              await pollTrustedCompletedValidation(eventHead, pullNumber);
            if (validationCompletion === null) {
              core.info('Skipped: trusted validation has not completed for this head.');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
              page: 1
            });
            if (
              files.length !== initialPull.changed_files ||
              new Set(files.map((file) => file.filename)).size !== files.length ||
              files.some(
                (file) =>
                  typeof file?.filename !== 'string' ||
                  !file.filename ||
                  typeof file?.status !== 'string' ||
                  (
                    file.status === 'renamed' &&
                    (
                      typeof file.previous_filename !== 'string' ||
                      !file.previous_filename
                    )
                  )
              )
            ) {
              core.info('Skipped: changed-file evidence is incomplete.');
              return;
            }

            const addedValues = new Map();
            const deletedValues = new Map();
            for (const file of files) {
              const currentInstaller = installerPath.test(file.filename);
              const previousInstaller =
                typeof file.previous_filename === 'string' &&
                installerPath.test(file.previous_filename);
              const baseInstaller =
                file.status === 'renamed'
                  ? previousInstaller
                  : currentInstaller;
              if (!currentInstaller && !previousInstaller) {
                continue;
              }
              if (
                file.status === 'renamed' &&
                currentInstaller !== previousInstaller
              ) {
                core.info('Skipped: a rename changed installer manifest classification.');
                return;
              }
              if (
                !['added', 'modified', 'removed', 'renamed'].includes(file.status)
              ) {
                core.info('Skipped: an installer file status is unsupported.');
                return;
              }
              if (file.status !== 'added' && baseInstaller) {
                const previousPath =
                  file.status === 'renamed'
                    ? file.previous_filename
                    : file.filename;
                const before = await readManifest(
                  owner,
                  repo,
                  previousPath,
                  eventBase
                );
                for (const value of elevationValues(before)) {
                  recordValue(deletedValues, value);
                }
              }
              if (file.status !== 'removed' && currentInstaller) {
                const after = await readManifest(
                  headRepositoryParts[0],
                  headRepositoryParts[1],
                  file.filename,
                  eventHead
                );
                for (const value of elevationValues(after)) {
                  recordValue(addedValues, value);
                }
              }
            }
            const values = [...addedValues].filter(
              ([value, count]) => count > (deletedValues.get(value) || 0)
            );
            if (values.length !== 1) {
              core.info('Skipped: no unique supported ElevationRequirement change was found.');
              return;
            }
            const [[elevationValue]] = values;

            const [comments, reviews, reviewComments] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100
                }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100
                })
            ]);
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });
            const labels = (pull.labels || []).map((label) =>
              String(label.name || '')
            );
            const isIndependentHuman = (entry) => {
              const login = entry?.user?.login;
              const type = entry?.user?.type;
              if (type === 'Bot') {
                return false;
              }
              return !(
                type === 'User' &&
                typeof login === 'string' &&
                login &&
                (
                  login === pull.user?.login ||
                  login === 'wingetbot'
                )
              );
            };
            const isDuplicate = comments.some((comment) =>
              trustedCommenters.has(comment.user?.login) &&
              (comment.body || '').includes(duplicateMarker)
            );

            if (
              pull.state !== 'open' ||
              pull.head.sha !== eventHead ||
              pull.head?.repo?.full_name !== headRepository ||
              pull.base.sha !== eventBase ||
              pull.base.ref !== 'master' ||
              pull.base.repo?.full_name?.toLowerCase() !== `${owner}/${repo}` ||
              pull.user?.login === 'wingetbot' ||
              !Array.isArray(pull.labels)
            ) {
              core.info('Skipped: pull request state changed during evaluation.');
              return;
            }
            if (
              !labels.includes('Validation-Completed') ||
              (
                await findTrustedCompletedValidation(
                  eventHead,
                  pullNumber,
                  validationCompletion
                )
              ) === null
            ) {
              core.info('Skipped: trusted validation is no longer complete for this head.');
              return;
            }
            if (labels.some((label) => hardAbortLabels.has(label))) {
              core.info('Skipped: a security or integrity hard-abort label is active.');
              return;
            }
            if (
              comments.some(isIndependentHuman) ||
              reviews.some(isIndependentHuman) ||
              reviewComments.some(isIndependentHuman)
            ) {
              core.info('Skipped: independent human feedback already exists.');
              return;
            }
            if (isDuplicate) {
              core.info('Skipped: this head already has an elevation reminder.');
              return;
            }

            const commentBody = [
              '> [!NOTE]',
              '> **Automated recommend-only reminder - verify before acting.**',
              '',
              sectionMarker,
              `This pull request adds or changes an \`ElevationRequirement\` field to \`${elevationValue}\`. Please confirm the selected value matches documented installer behavior:`,
              '',
              '- `elevatesSelf`: the installer conditionally decides whether elevation is needed.',
              '- `elevationRequired`: the installer always requires elevation.',
              '- `elevationProhibited`: the installer must not run elevated.',
              '',
              'A UAC prompt by itself does not establish `elevatesSelf`.',
              '',
              '<details><summary>Review evidence</summary>',
              '',
              `- **Head SHA:** \`${eventHead}\``,
              '</details>',
              '',
              duplicateMarker,
              `###### ${elevationMarker}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: commentBody
            });
