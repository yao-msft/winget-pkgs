name: Highest-Version Removal Reconciliation
on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
concurrency:
  group: highest-version-removal-reconciliation
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  audit:
    name: Audit stale removal labels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit point-in-time candidates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const targetLabel = "Highest-Version-Removal";
            const numericVersion = /^\d+(?:\.\d+)*$/;
            const candidateBudget = 150, fileBudget = 300;
            const pageSize = 100, contentsLimit = 1000;
            const counts = {
              enumerated: 0, audited: 0, newer: 0, noNewer: 0,
              skipped: 0, errors: 0,
            };
            const newer = [], skipped = [], errors = [];
            let defaultHeadSha = "unavailable", hardFailure = "";
            function compareNumericVersions(left, right) {
              const a = left.split(".").map(BigInt);
              const b = right.split(".").map(BigInt);
              const length = Math.max(a.length, b.length);
              for (let index = 0; index < length; index++) {
                const leftSegment = a[index] ?? 0n;
                const rightSegment = b[index] ?? 0n;
                if (leftSegment < rightSegment) return -1;
                if (leftSegment > rightSegment) return 1;
              }
              return 0;
            }
            function message(error) {
              return String(error?.message ?? error).replace(/[\r\n]+/g, " ").slice(0, 300);
            }
            function escapeHtml(value) {
              return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }
            function recordSkip(number, reason) {
              counts.skipped++;
              skipped.push(`#${number}: ${reason}`);
            }
            function recordError(number, error) {
              counts.errors += 1;
              errors.push(`#${number}: ${message(error)}`);
            }
            async function enumerateCandidates(defaultBranch) {
              const numbers = new Set();
              let expectedTotal = null;
              let pageCount = 1;
              for (let page = 1; page <= pageCount; page++) {
                const response = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:pr is:open base:"${defaultBranch}" ` +
                    `label:"${targetLabel}"`,
                  per_page: pageSize,
                  sort: "created",
                  order: "asc",
                  page,
                });
                const { incomplete_results: incomplete, items, total_count: total } =
                  response.data;
                if (incomplete || !Array.isArray(items)) {
                  throw new Error("GitHub Search returned an incomplete candidate set.");
                }
                if (!Number.isSafeInteger(total) || total < 0 || total > candidateBudget) {
                  throw new Error(
                    `Candidate count ${total} exceeds the ${candidateBudget}-PR budget.`,
                  );
                }
                if (expectedTotal !== null && total !== expectedTotal) {
                  throw new Error("Candidate count changed during enumeration.");
                }
                expectedTotal = total;
                pageCount = Math.ceil(total / pageSize);
                for (const item of items) {
                  if (!Number.isSafeInteger(item.number) || !item.pull_request) {
                    throw new Error("Search returned an invalid pull request.");
                  }
                  numbers.add(item.number);
                }
              }
              const result = [...numbers].sort((left, right) => left - right);
              if (result.length !== expectedTotal) {
                throw new Error("Candidate enumeration was incomplete or duplicated.");
              }
              return result;
            }
            try {
              const repository = await github.rest.repos.get({ owner, repo });
              const defaultBranch = repository.data.default_branch;
              if (!defaultBranch) throw new Error("Repository has no default branch.");
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
              defaultHeadSha = branch.data.commit.sha;
              if (!/^[0-9a-f]{40}$/i.test(defaultHeadSha)) {
                throw new Error("Default branch did not resolve to a commit SHA.");
              }
              const candidateNumbers = await enumerateCandidates(defaultBranch);
              const confirmation = await enumerateCandidates(defaultBranch);
              if (
                candidateNumbers.length !== confirmation.length ||
                candidateNumbers.some(
                  (number, index) => number !== confirmation[index],
                )
              ) {
                throw new Error("Candidate set changed during enumeration.");
              }
              counts.enumerated = candidateNumbers.length;
              for (const number of candidateNumbers) {
                try {
                  const pull = (await github.rest.pulls.get({
                    owner, repo, pull_number: number,
                  })).data;
                  const labels = (pull.labels ?? []).map((label) => String(label.name ?? ""));
                  if (
                    pull.state !== "open" ||
                    pull.base.ref !== defaultBranch ||
                    !labels.includes(targetLabel)
                  ) {
                    recordSkip(number, "no longer matches the point-in-time search");
                    continue;
                  }
                  const headSha = pull.head?.sha;
                  const baseSha = pull.base?.sha;
                  const headRepo = pull.head?.repo?.full_name;
                  const baseRepo = pull.base?.repo?.full_name;
                  if (
                    !/^[0-9a-f]{40}$/i.test(headSha ?? "") ||
                    !/^[0-9a-f]{40}$/i.test(baseSha ?? "") ||
                    typeof headRepo !== "string" ||
                    !headRepo ||
                    baseRepo !== `${owner}/${repo}`
                  ) {
                    recordSkip(number, "pull request repository or SHA identity is unavailable");
                    continue;
                  }
                  if (
                    !Number.isSafeInteger(pull.changed_files) ||
                    pull.changed_files < 1 ||
                    pull.changed_files > fileBudget
                  ) {
                    recordSkip(number, `file count is outside the 1-${fileBudget} budget`);
                    continue;
                  }
                  const files = [];
                  const filePages = Math.ceil(pull.changed_files / pageSize);
                  for (let page = 1; page <= filePages; page++) {
                    const response = await github.rest.pulls.listFiles({
                      owner, repo, pull_number: number, per_page: pageSize, page,
                    });
                    files.push(...response.data);
                  }
                  if (files.length !== pull.changed_files) {
                    recordSkip(number, "pull request file enumeration was incomplete");
                    continue;
                  }
                  if (new Set(files.map((file) => file.filename)).size !== files.length) {
                    recordSkip(number, "pull request file enumeration contained duplicates");
                    continue;
                  }
                  const finalPull = (await github.rest.pulls.get({
                    owner, repo, pull_number: number,
                  })).data;
                  const finalLabels = (finalPull.labels ?? [])
                    .map((label) => String(label.name ?? ""));
                  if (
                    finalPull.state !== "open" ||
                    finalPull.base.ref !== defaultBranch ||
                    !finalLabels.includes(targetLabel) ||
                    finalPull.head?.sha !== headSha ||
                    finalPull.head?.repo?.full_name !== headRepo ||
                    finalPull.base?.sha !== baseSha ||
                    finalPull.base?.repo?.full_name !== baseRepo ||
                    finalPull.changed_files !== pull.changed_files
                  ) {
                    recordSkip(number, "pull request changed during file enumeration");
                    continue;
                  }
                  if (files.some((file) => file.status !== "removed")) {
                    recordSkip(number, "changes are not removal-only");
                    continue;
                  }
                  const folders = new Set();
                  for (const file of files) {
                    const match = file.filename.match(
                      /^(manifests\/[^/]+\/.+)\/([^/]+)\/[^/]+\.ya?ml$/,
                    );
                    folders.add(match ? `${match[1]}\n${match[2]}` : "invalid");
                  }
                  if (folders.size !== 1 || folders.has("invalid")) {
                    recordSkip(number, "files do not identify one manifest version folder");
                    continue;
                  }
                  const [packagePath, removedVersion] = [...folders][0].split("\n");
                  if (!numericVersion.test(removedVersion)) {
                    recordSkip(number, "removed version is not dotted numeric");
                    continue;
                  }
                  let entries;
                  try {
                    entries = (await github.rest.repos.getContent({
                      owner, repo, path: packagePath, ref: defaultHeadSha,
                    })).data;
                  } catch (error) {
                    if (error.status === 404) {
                      recordSkip(number, `package path is absent at ${defaultHeadSha}`);
                      continue;
                    }
                    throw error;
                  }
                  if (
                    !Array.isArray(entries) ||
                    entries.length >= contentsLimit
                  ) {
                    recordSkip(number, "package directory may exceed the Contents API limit");
                    continue;
                  }
                  const versions = entries
                    .filter((entry) => entry.type === "dir")
                    .map((entry) => entry.name);
                  if (
                    versions.length === 0 ||
                    versions.length !== entries.length ||
                    versions.some((version) => !numericVersion.test(version))
                  ) {
                    recordSkip(number, "existing versions are mixed or not dotted numeric");
                    continue;
                  }
                  const newerVersions = versions
                    .filter((version) =>
                      compareNumericVersions(version, removedVersion) > 0)
                    .sort(compareNumericVersions);
                  counts.audited++;
                  if (newerVersions.length === 0) {
                    counts.noNewer++;
                  } else {
                    counts.newer++;
                    newer.push(
                      [`#${number}`, packagePath, removedVersion, newerVersions.at(-1)],
                    );
                  }
                } catch (error) {
                  recordError(number, error);
                }
              }
            } catch (error) {
              hardFailure = message(error);
              core.setFailed(hardFailure);
            } finally {
              const summary = core.summary
                .addHeading("Highest-Version-Removal reconciliation audit")
                .addRaw(
                  "Read-only point-in-time audit. It does not modify pull requests or labels. " +
                  "Repository and pull request changes after their API reads are not reflected.",
                )
                .addRaw(`\n\nDefault branch SHA: \`${defaultHeadSha}\``)
                .addTable([
                  ["Enumerated", "Audited", "Newer", "No newer", "Skipped", "Errors"],
                  Object.values(counts).map(String),
                ]);
              if (hardFailure) {
                summary.addHeading("Enumeration failure", 2)
                  .addRaw(escapeHtml(hardFailure));
              }
              summary.addHeading("Newer versions found", 2).addTable([
                ["Pull request", "Package path", "Removed version", "Newest version"],
                ...(newer.length
                  ? newer.map((row) => row.map(escapeHtml))
                  : [["None", "", "", ""]]),
              ]);
              summary.addHeading("Skipped", 2)
                .addList(skipped.length ? skipped.map(escapeHtml) : ["None"]);
              summary.addHeading("Per-candidate errors", 2)
                .addList(errors.length ? errors.map(escapeHtml) : ["None"]);
              await summary.write();
              if (counts.errors > 0) {
                core.setFailed(
                  `${counts.errors} candidate audit(s) failed; reconciliation is incomplete.`,
                );
              }
            }
